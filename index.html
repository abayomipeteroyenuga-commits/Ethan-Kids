<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan Kids | Adult sign in</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"><script src="config.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="auth.js" defer></script></head><body class="auth-page"><main class="auth-shell"><img src="assets/ethan-code-quest.png" alt="Ethan Code Quest logo"><span class="pill">ETHAN KIDS · STANDALONE</span><h1>Welcome, grown-ups!</h1><p>Parents, guardians and teachers sign in first. Children can then enjoy coding activities without their own accounts.</p><form id="adult-form"><label for="adult-email-input">Your email</label><input id="adult-email-input" type="email" required autocomplete="email" placeholder="name@example.com"><label for="adult-password">Password</label><input id="adult-password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"><button class="primary" type="submit" data-auth-action="signin">Sign in</button><button type="submit" data-auth-action="signup">Create adult account</button></form><button id="reset-password" type="button">Forgot password?</button><p id="auth-status" role="status" class="muted"></p><p class="muted">For adults only. Children do not need to enter personal information.</p></main></body></html>
