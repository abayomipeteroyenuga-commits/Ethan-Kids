<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan Kids | Reset password</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"><script src="config.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script></head><body class="auth-page"><main class="auth-shell"><h1>Choose a new password</h1><form id="reset-form"><label>New password<input id="new-password" type="password" required minlength="8" autocomplete="new-password"></label><button class="primary" type="submit">Update password</button></form><p id="status" role="status"></p><a href="index.html">Back to sign in</a></main><script>window.addEventListener('DOMContentLoaded',()=>{const c=window.ETHAN_KIDS_CONFIG||{};const status=document.getElementById('status');if(!c.supabaseUrl||!c.supabasePublishableKey||!window.supabase){status.textContent='Adult sign-in is not configured.';return;}const client=window.supabase.createClient(c.supabaseUrl,c.supabasePublishableKey,{auth:{detectSessionInUrl:true}});document.getElementById('reset-form').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.updateUser({password:document.getElementById('new-password').value});status.textContent=error?error.message:'Password updated. Return to sign in.';};});</script></body></html>
